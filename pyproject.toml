[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scavenger"
version = "0.1.0.dev0"
description = "Goal-loop agent system: vague brief in, verified goal out, strategies until proven done"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx"]
license = { text = "MIT" }

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "respx", "ruff", "freezegun"]
anthropic = ["anthropic"]
openai = ["openai"]

[project.scripts]
scavenger = "scavenger.cli:main"

[tool.setuptools]
package-dir = { "" = "daemon" }

[tool.ruff]
target-version = "py311"
exclude = ["docs", ".venv"]
